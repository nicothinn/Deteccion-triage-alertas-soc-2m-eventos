# demo local: restringida a localhost; feedback persiste en volumen Docker
services:
  soc:
    build: .
    ports:
      - "${PUBLISH_IP:-127.0.0.1}:${HOST_PORT:-8000}:${PORT:-8000}"
    volumes:
      - soc_feedback:/app/feedback
    environment:
      PORT: "${PORT:-8000}"
      FEEDBACK_PATH: "${FEEDBACK_PATH:-/app/feedback/feedback.csv}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8000,http://127.0.0.1:8000}"

volumes:
  soc_feedback:
